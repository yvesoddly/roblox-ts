name: Test create-roblox-ts

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [game, place, model, plugin, package]
    steps:
      - name: Checkout roblox-ts repo
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Setup roblox-ts repo
        uses: ./roblox-ts/.github/actions/setup
        with:
          directory: roblox-ts

      - name: Build workspace packages
        working-directory: roblox-ts
        run: corepack pnpm run build

      - name: Test local generated-project toolchain
        working-directory: roblox-ts
        env:
          RBXTS_TEMPLATE_TYPE: ${{ matrix.type }}
        run: corepack pnpm run test-toolchain
