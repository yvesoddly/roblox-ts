name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2.3.4

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Compile Source Files
        run: pnpm run build

      - name: Package VS Code Extension Locally
        run: pnpm --filter vscode-roblox-ts run package
