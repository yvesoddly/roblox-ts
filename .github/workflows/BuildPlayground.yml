name: Build Playground

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-playground:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roblox-ts repo
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Setup roblox-ts repo
        uses: ./roblox-ts/.github/actions/setup
        with:
          directory: roblox-ts

      - name: Pack workspace packages
        working-directory: roblox-ts
        run: |
          pnpm --filter @rbxts/compiler-types pack --out ../../compiler-types.tgz
          pnpm --filter @roblox-ts/luau-ast pack --out ../../luau-ast.tgz
          pnpm --filter roblox-ts pack --out ../../roblox-ts.tgz

      - name: Checkout roblox-ts.com repo
        uses: actions/checkout@v4
        with:
          repository: roblox-ts/roblox-ts.com
          path: roblox-ts.com

      - name: Setup roblox-ts.com repo
        run: |
          cd roblox-ts.com
          npm install

      - name: Update roblox-ts
        run: |
          cd roblox-ts.com/rbxts-worker
          npm install ../../roblox-ts/compiler-types.tgz ../../roblox-ts/luau-ast.tgz ../../roblox-ts/roblox-ts.tgz

      - name: Build Worker
        run: |
          cd roblox-ts.com
          npm run build:rbxts-worker
