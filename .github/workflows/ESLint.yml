name: ESLint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2.3.4

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run eslint
