name: Publish
run-name: Publish ${{ inputs.package || 'roblox-ts' }} ${{ inputs.version || 'next' }} (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        default: roblox-ts
        options:
          - roblox-ts
          - luau-ast
          - cli
      version:
        description: Version to publish. Leave empty to publish a @next build.
        required: false
        type: string
  schedule:
    - cron: '0 7 * * *'

jobs:
  publish:
    if: github.repository == 'roblox-ts/roblox-ts' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publishing (OIDC)
      contents: write # required to push the version bump commit and tags
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.pat }}

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest # trusted publishing requires npm >= 11.5.1

      - name: Publish @next
        if: inputs.version == ''
        working-directory: packages/${{ inputs.package || 'roblox-ts' }}
        run: |
          VERSION="$(jq -r .version package.json)-dev-$(git rev-parse --short HEAD)"
          NAME="$(jq -r .name package.json)"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION has already been published, skipping."
            exit 0
          fi
          npm version --no-git-tag-version "$VERSION"
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          npm publish "$RUNNER_TEMP/package.tgz" --tag next

      - name: Publish
        if: inputs.version != ''
        working-directory: packages/${{ inputs.package || 'roblox-ts' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          npm version --no-git-tag-version "$RELEASE_VERSION"
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          npm publish "$RUNNER_TEMP/package.tgz"
          VERSION="$(jq -r .version package.json)"
          git add package.json
          NAME="$(jq -r .name package.json)"
          git commit -m "$NAME $VERSION"
          if [ "$NAME" = "roblox-ts" ]; then
            git tag "v$VERSION"
          else
            git tag "${NAME##*/}-v$VERSION"
          fi
          git push
          git push --tags
